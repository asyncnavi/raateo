name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.0.0

      - name: Setup Golang
        uses: actions/setup-go@v4.0.0
        with:
          go-version: 1.22

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ACTIONS_DEPLOY_KEY }}" | base64 --decode > ~/.ssh/id_rsa.pub
          chmod 600 ~/.ssh/id_rsa.pub
          ssh-keyscan -H ${{ secrets.DIGITALOCEAN_SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to DigitalOcean
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.DIGITALOCEAN_SERVER_IP }} "cd /var/www/raateo && \
          sudo systemctl stop myapp || true && \
          git pull origin main && \
          go mod tidy && \
          go build -o main . && \
          sudo systemctl start myapp && \
          sudo systemctl enable myapp && \
          echo 'Deployment successful!'"
